x-logging: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    container_name: stagetrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *journaux
    networks:
      - stagetrack_network

  backend:
    build:
      context: ./backend
    image: stagetrack-backend:1.0
    container_name: stagetrack_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - fichiers_prives:/app/fichiers_prives
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *journaux
    networks:
      - stagetrack_network

  nginx:
    image: nginx:1.31.5-alpine
    container_name: stagetrack_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *journaux
    networks:
      - stagetrack_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  fichiers_prives:

networks:
  stagetrack_network:
    driver: bridge