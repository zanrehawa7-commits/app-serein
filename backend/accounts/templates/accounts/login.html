{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-briefcase-fill" style="font-size: 3rem; color: #1B4F72;"></i>
                    <h3 class="mt-2">StageTrack</h3>
                    <p class="text-muted small">Serein-GE — Gestion des stages</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Email ou mot de passe incorrect.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Adresse email</label>
                        <input
                            type="email"
                            name="username"
                            id="id_username"
                            class="form-control"
                            required
                            autofocus
                            placeholder="nom@serein-ge.com"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Mot de passe</label>
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="form-control"
                            required
                            placeholder="••••••••"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted small mt-3">
            © {{ now|date:"Y" }} Serein-GE — Tous droits réservés
        </p>
    </div>
</div>
{% endblock %}
