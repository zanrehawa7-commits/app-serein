{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ titre }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_retour }}" class="btn btn-outline-secondary btn-sm" title="Retour">
        <i class="bi bi-arrow-left"></i>
    </a>
    <div>
        <h5 class="mb-0 fw-semibold">{{ titre }}</h5>
        {% if sous_titre %}<p class="text-muted small mb-0">{{ sous_titre }}</p>{% endif %}
    </div>
</div>

<div class="card border-0 shadow-sm" style="max-width:640px;">
    <div class="card-body p-4">
        {% crispy form %}
    </div>
</div>
{% endblock %}
