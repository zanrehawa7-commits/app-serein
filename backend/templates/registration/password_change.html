{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Changer le mot de passe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header" style="background-color:#1B4F72;">
                <h5 class="text-white mb-0"><i class="bi bi-key me-2"></i>Changer le mot de passe</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary" style="background-color:#1B4F72;border-color:#1B4F72;">
                            Enregistrer
                        </button>
                        <a href="{% url 'comptes:tableau_de_bord' %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
